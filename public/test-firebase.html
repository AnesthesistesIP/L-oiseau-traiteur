<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Test minimal Firestore</title>
  <style>
    body { font-family: monospace; padding: 24px; background: #111; color: #eee; }
    #log { white-space: pre-wrap; background: #000; padding: 16px; border-radius: 8px; margin-top: 16px; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <h2>Test minimal Firestore (sans React, sans build)</h2>
  <p>Cette page essaie d'écrire puis de relire un document, et affiche le résultat brut ci-dessous.</p>
  <div id="log">Chargement...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const log = document.getElementById("log");
    function write(msg, cls) {
      const line = document.createElement("div");
      if (cls) line.className = cls;
      line.textContent = msg;
      log.appendChild(line);
    }
    log.textContent = "";

    // Collez ici les mêmes valeurs que dans votre firebaseConfig (visibles dans Firebase >
    // Paramètres du projet > Vos applications).
    const firebaseConfig = {
      apiKey: "AIzaSyAB1T2oQDgyY9owzto2ctq4W3iB8PDE4uk",
      authDomain: "commandes-oiseau-traiteur.firebaseapp.com",
      projectId: "commandes-oiseau-traiteur",
      storageBucket: "commandes-oiseau-traiteur.firebasestorage.app",
      messagingSenderId: "314699859173",
      appId: "1:314699859173:web:56ec0afcf6b749e35b800c",
    };

    write("Config utilisée : " + JSON.stringify(firebaseConfig, null, 2));

    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      write("Firebase initialisé, tentative d'écriture...");

      const ref = doc(db, "meta", "test-minimal");
      await setDoc(ref, { hello: "world", ts: Date.now() });
      write("✅ Écriture réussie !", "ok");

      const snap = await getDoc(ref);
      write("✅ Lecture réussie : " + JSON.stringify(snap.data()), "ok");
    } catch (e) {
      write("❌ ERREUR : " + e.code + " — " + e.message, "err");
      console.error(e);
    }
  </script>
</body>
</html>
